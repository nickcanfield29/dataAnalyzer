    <!-- templates/index.html (or upload.html etc.) -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h1>Step 1 – Upload Data &amp; Data‑map</h1>

  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}

  <form method="POST" enctype="multipart/form-data">
    <div class="mb-3">
      <label class="form-label"><strong>Data file (CSV)</strong></label>
      <input class="form-control"
             type="file"
             name="data_file"
             accept=".csv"
             required>
    </div>

    <div class="mb-3">
      <label class="form-label"><strong>Data-map file (CSV)</strong></label>
      <input class="form-control"
             type="file"
             name="map_file"
             accept=".csv"
             required>
    </div>

    <button class="btn btn-primary" type="submit">Upload &amp; continue</button>
  </form>

</body>
</html>
