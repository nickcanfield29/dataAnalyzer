<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Crossâ€‘Tab Builder â€“ Benchmark Choice</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    .choice-card {
      border: 2px solid #ddd;
      border-radius: 8px;
      padding: 20px;
      margin: 15px 0;
      cursor: pointer;
      transition: all 0.3s;
    }
    .choice-card:hover {
      border-color: #4F81BD;
      background: #f8f9fa;
    }
    .choice-card input[type="radio"] {
      margin-right: 10px;
      transform: scale(1.3);
    }
    .tier-config {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 5px;
      margin-top: 15px;
      display: none;
    }
    .tier-config.active {
      display: block;
    }
    .tier-input-group {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 10px;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <h1>Create a Benchmark?</h1>
  <p>Benchmarks let you combine multiple questions into a single score, then group respondents into tiers (e.g., Low/Medium/High).</p>

  <form method="POST" action="{{ url_for('benchmark_setup') }}">
    <input type="hidden" name="data_fn" value="{{ data_fn }}">
    <input type="hidden" name="map_fn" value="{{ map_fn }}">

    <div class="choice-card" onclick="selectChoice('yes')">
      <label>
        <input type="radio" name="build_benchmark" value="yes" id="choice-yes">
        <strong>Yes, build a benchmark</strong>
        <p style="margin-left: 30px; color: #666;">I want to create a composite score from multiple questions.</p>
      </label>
    </div>

    <div id="tier-config" class="tier-config">
      <label>
        <strong>Benchmark Name:</strong><br>
        <input type="text" name="benchmark_name" placeholder="e.g., Customer Maturity"
               style="width: 100%; padding: 8px; margin-top: 5px;" value="My Benchmark">
      </label>

      <label style="display: block; margin-top: 15px;">
        <strong>Number of tiers (3-6):</strong><br>
        <select name="num_tiers" id="num_tiers" onchange="updateTierInputs()"
                style="padding: 8px; margin-top: 5px;">
          <option value="3" selected>3 tiers</option>
          <option value="4">4 tiers</option>
          <option value="5">5 tiers</option>
          <option value="6">6 tiers</option>
        </select>
      </label>

      <div id="tier-inputs" style="margin-top: 15px;">
        <p><strong>Define your tiers:</strong></p>
        <div class="tier-input-group">
          <strong>Label</strong>
          <strong>Min Score</strong>
          <strong>Max Score</strong>
        </div>
        <div class="tier-input-group">
          <input type="text" name="tier_0_label" value="Low" placeholder="Tier 1 Label">
          <input type="number" name="tier_0_min" value="0" step="0.1">
          <input type="number" name="tier_0_max" value="33" step="0.1">
        </div>
        <div class="tier-input-group">
          <input type="text" name="tier_1_label" value="Medium" placeholder="Tier 2 Label">
          <input type="number" name="tier_1_min" value="34" step="0.1">
          <input type="number" name="tier_1_max" value="66" step="0.1">
        </div>
        <div class="tier-input-group">
          <input type="text" name="tier_2_label" value="High" placeholder="Tier 3 Label">
          <input type="number" name="tier_2_min" value="67" step="0.1">
          <input type="number" name="tier_2_max" value="100" step="0.1">
        </div>
      </div>
    </div>

    <div class="choice-card" onclick="selectChoice('no')">
      <label>
        <input type="radio" name="build_benchmark" value="no" id="choice-no">
        <strong>No, skip to analysis</strong>
        <p style="margin-left: 30px; color: #666;">Go directly to selecting variables for cross-tabulation.</p>
      </label>
    </div>

    <button type="submit" style="margin-top: 20px; padding: 12px 24px; font-size: 16px;">Continue</button>
  </form>

  <script>
    function selectChoice(choice) {
      document.getElementById('choice-' + choice).checked = true;
      const tierConfig = document.getElementById('tier-config');
      if (choice === 'yes') {
        tierConfig.classList.add('active');
      } else {
        tierConfig.classList.remove('active');
      }
    }

    function updateTierInputs() {
      const numTiers = parseInt(document.getElementById('num_tiers').value);
      const container = document.getElementById('tier-inputs');

      const defaultLabels = {
        3: ['Low', 'Medium', 'High'],
        4: ['Low', 'Medium-Low', 'Medium-High', 'High'],
        5: ['Very Low', 'Low', 'Medium', 'High', 'Very High'],
        6: ['Very Low', 'Low', 'Medium-Low', 'Medium-High', 'High', 'Very High']
      };

      const labels = defaultLabels[numTiers] || Array(numTiers).fill('').map((_, i) => `Tier ${i+1}`);
      const step = 100 / numTiers;

      let html = `
        <p><strong>Define your tiers:</strong></p>
        <div class="tier-input-group">
          <strong>Label</strong>
          <strong>Min Score</strong>
          <strong>Max Score</strong>
        </div>
      `;

      for (let i = 0; i < numTiers; i++) {
        const min = Math.round(i * step);
        const max = Math.round((i + 1) * step);
        html += `
          <div class="tier-input-group">
            <input type="text" name="tier_${i}_label" value="${labels[i]}" placeholder="Tier ${i+1} Label">
            <input type="number" name="tier_${i}_min" value="${min}" step="0.1">
            <input type="number" name="tier_${i}_max" value="${max}" step="0.1">
          </div>
        `;
      }

      container.innerHTML = html;
    }

    // Auto-show tier config if "yes" is pre-selected
    document.addEventListener('DOMContentLoaded', function() {
      const yesRadio = document.getElementById('choice-yes');
      if (yesRadio.checked) {
        document.getElementById('tier-config').classList.add('active');
      }
    });
  </script>
</body>
</html>
